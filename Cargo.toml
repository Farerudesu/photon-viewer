[package]
name = "photon_viewer"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity Systems"]
description = "Ultra-fast, GPU-accelerated desktop image viewer"

[[bin]]
name = "photon_viewer"
path = "src/main.rs"

[[bin]]
name = "photon_setup"
path = "src/bin/setup.rs"

[dependencies]
# Windowing and GPU Rendering
winit = { version = "0.29", features = ["rwh_06"] }
wgpu = "22.1"
pollster = "0.3"
bytemuck = { version = "1.20", features = ["derive"] }
half = "2.7"

# High-Performance I/O & Threading
memmap2 = "0.9"
rayon = "1.10"
crossbeam-channel = "0.5"
parking_lot = "0.12"

# Codecs (Phase 3: All Standard Formats)
zune-jpeg = "0.5"
png = "0.18"
image = { version = "0.25", default-features = false, features = [
    "png", "jpeg", "gif", "webp", "bmp", "tiff", "tga", "dds", "hdr", "ico", "pnm", "exr", "qoi", "rayon"
] }
resvg = "0.44"

# Utility
log = "0.4"
env_logger = "0.11"
rawloader = "0.37.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
